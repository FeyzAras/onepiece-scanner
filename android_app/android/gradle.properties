# Flutter-Vorlage setzt hier -Xmx8G -XX:MaxMetaspaceSize=4G. Das ist auf diesem Rechner
# (15,5 GB RAM, davon ~9 GB durch andere Programme belegt) zu viel und hat den Build-Abbruch
# wegen Speichermangel ausgeloest. Fuer dieses Projekt reichen 2 GB deutlich.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=false
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
