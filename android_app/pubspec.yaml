name: onepiece_scanner
description: "One Piece TCG Kartenscanner - Karte vor die Kamera halten, wird automatisch erkannt."
publish_to: 'none'

# Die Versionsnummer ist die einzige Quelle der Wahrheit - Git-Tag und version.json
# werden daraus abgeleitet.
#
# Die Build-Nummer folgt der Regel major*10000 + minor*100 + patch (0.8.0 -> 800).
# Beim Bauen mit --split-per-abi addiert Flutter 1000 * ABI, arm64 ergibt also 2800.
# Das muss groesser bleiben als der bisher veroeffentlichte Wert 2001, sonst lehnt
# Android die Installation als Downgrade ab.
version: 0.8.0+800

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  shared_preferences: ^2.5.5
  cached_network_image: ^4.0.4
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cards.json
    # Fehlte bisher: die Datei lag im Ordner, wurde aber nicht ins APK aufgenommen.
    # Dadurch scheiterte DeckStore.loadBundled() immer still und der Deck-Tab
    # funktionierte nur mit Netzverbindung.
    - assets/decks.json

