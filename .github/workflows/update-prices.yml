name: Preise aktualisieren

# Holt einmal taeglich die Cardmarket-Preisdaten und schreibt die schlanke Preisdatei
# docs/data/prices.json. Die App laedt sie beim Start - neue Preise kommen also an,
# ohne dass die App neu gebaut und installiert werden muss.
#
# Quelle sind die Export-Dateien, die Cardmarket selbst taeglich veroeffentlicht und
# ausdruecklich zur Nutzung in eigenen Anwendungen freigibt.

on:
  schedule:
    - cron: "41 4 * * *" # taeglich 04:41 UTC, nach Cardmarkets eigener Aktualisierung
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      # Der Katalog wird frisch aufgebaut: data/cards.normalized.json ist bewusst nicht
      # versioniert, weil es eine Zwischendatei ist.
      - name: Kartenkatalog aufbauen
        run: node scripts/build-db.js

      - name: Cardmarket-Export laden
        run: node scripts/fetch-cardmarket.js

      - name: Preise zuordnen
        run: node scripts/import-cardmarket-prices.js

      - name: Preisdatei schreiben
        run: node scripts/build-price-file.js

      - name: Aenderungen committen
        run: |
          if git diff --quiet docs/data/prices.json; then
            echo "Keine Preisaenderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/prices.json
          git commit -m "Preise aktualisiert ($(date -u +%Y-%m-%d))"
          git push
